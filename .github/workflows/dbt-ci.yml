name: FABINI dbt CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt-duckdb
        run: python -m pip install dbt-duckdb==1.11.1

      - name: Build models and run tests
        run: |
          mkdir -p exports
          dbt build --profiles-dir .

      - name: Verify CSV exports
        run: |
          test -s exports/fact_sales.csv
          test -s exports/fact_daily_metrics.csv

      - name: Upload validated CSV exports
        uses: actions/upload-artifact@v4
        with:
          name: fabini-dbt-csv-exports
          path: |
            exports/fact_sales.csv
            exports/fact_daily_metrics.csv
          if-no-files-found: error
          retention-days: 7
